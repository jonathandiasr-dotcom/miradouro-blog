<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Palette principale</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--mrt-beige);font-family:var(--font-core);color:var(--mrt-blue)}.lbl{font:700 10px/1 var(--font-core);letter-spacing:.09em;text-transform:uppercase;color:var(--mrt-gold)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--mrt-graphite)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:78px;border-radius:8px;background:#005B6A;"></div><div style="font:700 13px/1 var(--font-core)">Bleu marine</div><div class="mono">#005B6A</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:78px;border-radius:8px;background:#E0B55F;"></div><div style="font:700 13px/1 var(--font-core)">Doré</div><div class="mono">#E0B55F</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:78px;border-radius:8px;background:#3B3B3B;"></div><div style="font:700 13px/1 var(--font-core)">Gris foncé</div><div class="mono">#3B3B3B</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:78px;border-radius:8px;background:#F3F3F3;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div style="font:700 13px/1 var(--font-core)">Gris clair</div><div class="mono">#F3F3F3</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:78px;border-radius:8px;background:#FBF9F2;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div style="font:700 13px/1 var(--font-core)">Beige</div><div class="mono">#FBF9F2</div></div>
</div></body></html>
