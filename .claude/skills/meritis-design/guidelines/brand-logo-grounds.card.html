<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Fonds</title><link rel="stylesheet" href="../styles.css">

<div style="background:var(--mrt-gold);border-radius:8px;padding:22px;display:grid;place-items:center"><img src="../assets/logos/logo-secondaire-white.png" alt="" style="width:100%"></div>
<div style="background:var(--mrt-white);box-shadow:inset 0 0 0 1px var(--mrt-grey-200);border-radius:8px;padding:22px;display:grid;place-items:center"><img src="../assets/logos/logo-secondaire-black.png" alt="" style="width:100%"></div>
