<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Rayons</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--mrt-beige);font-family:var(--font-core);color:var(--mrt-blue)}.lbl{font:700 10px/1 var(--font-core);letter-spacing:.09em;text-transform:uppercase;color:var(--mrt-gold)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--mrt-graphite)}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:60px;background:var(--mrt-white);border-radius:4px;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div class="mono">sm 4</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:60px;background:var(--mrt-white);border-radius:8px;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div class="mono">md 8</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:60px;background:var(--mrt-white);border-radius:16px;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div class="mono">lg 16</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:60px;background:var(--mrt-white);border-radius:24px;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div class="mono">xl 24</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:60px;background:var(--mrt-white);border-radius:999px;box-shadow:inset 0 0 0 1px var(--mrt-grey-200)"></div><div class="mono">pill</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:96px;height:60px;background:var(--mrt-white);border-radius:16px;box-shadow:var(--shadow-md)"></div><div class="mono">shadow-md</div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:60px;height:60px;background:var(--mrt-blue);border-radius:100% 0 0 0"></div><div class="mono">quarter</div></div>
</div></body></html>
