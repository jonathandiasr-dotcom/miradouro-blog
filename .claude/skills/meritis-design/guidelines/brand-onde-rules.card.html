<!-- @dsCard group="Brand" viewport="700x200" name="Ondes — rotations & superposition" subtitle="90° increments only; white at 10% is the one permitted overlay" -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Règles ondes</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--mrt-beige);font-family:var(--font-core);color:var(--mrt-blue)}.lbl{font:700 10px/1 var(--font-core);letter-spacing:.09em;text-transform:uppercase;color:var(--mrt-gold)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--mrt-graphite)}</style></head><body><div style="display:flex;gap:26px;align-items:center">
<div style="display:flex;gap:8px">
<img src="../assets/waves/onde-arcs-bleue.png" alt="" style="width:70px;height:70px;transform:rotate(0deg)"><img src="../assets/waves/onde-arcs-bleue.png" alt="" style="width:70px;height:70px;transform:rotate(90deg)"><img src="../assets/waves/onde-arcs-bleue.png" alt="" style="width:70px;height:70px;transform:rotate(180deg)"><img src="../assets/waves/onde-arcs-bleue.png" alt="" style="width:70px;height:70px;transform:rotate(270deg)">
</div>
<div style="position:relative;width:130px;height:130px;background:var(--mrt-blue);border-radius:8px;overflow:hidden">
<img src="../assets/waves/onde-pleine-claire.png" alt="" style="position:absolute;inset:0;width:130px;height:130px;opacity:.1;transform:rotate(180deg)">
</div>
<div style="font:400 12px/1.6 var(--font-core);max-width:22ch">Rotation à 90° autorisée. Superposition : blanc à 10 % d'opacité.</div>
</div></body></html>
