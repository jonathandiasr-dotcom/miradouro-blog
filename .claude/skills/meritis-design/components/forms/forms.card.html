<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Form components</title>
<link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>body{margin:0;padding:24px;background:var(--mrt-beige)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}.dark{background:var(--mrt-blue);padding:20px;border-radius:8px;display:grid;gap:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Field, Select, Checkbox, Button } = window.MeritisDesignSystem_198a6a;
function Demo(){const [ok,setOk]=React.useState(true);return (<div className="grid">
<div style={{display:'grid',gap:14}}>
<Field label="Votre e-mail professionnel" type="email" placeholder="prenom.nom@entreprise.fr" />

</div>

<div className="dark mrt-on-dark">
<Field tone="dark" label="Inscrivez-vous à la newsletter" type="email" placeholder="prenom.nom@entreprise.fr" />
<Field tone="dark" label="Ville" error="Champ obligatoire" />
<Button variant="on-dark" fullWidth>S'inscrire</Button>
</div>
</div>);}
